<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inky Hub | SM Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-200">

    <nav class="bg-black dark:bg-gray-950 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
            <i data-lucide="monitor-smartphone" class="w-6 h-6"></i>
            Inky Hub
        </h1>
        <div class="flex gap-2">
            <button id="themeToggleBtn" class="bg-gray-800 hover:bg-gray-700 p-2 rounded transition flex items-center justify-center" title="Toggle Dark Mode">
                <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
            </button>
            <button id="settingsBtn" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm transition flex items-center gap-2">
                <i data-lucide="settings" class="w-4 h-4"></i>
                Settings
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border dark:border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i data-lucide="layout-template" class="w-5 h-5 text-gray-500"></i>
                        Live Preview
                    </h2>
                    <span id="statusIndicator" class="text-xs px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded text-gray-600 dark:text-gray-300 flex items-center gap-1">
                        <i data-lucide="activity" class="w-3 h-3"></i> Idle
                    </span>
                </div>
                <div class="border-2 border-gray-300 dark:border-gray-600 w-full overflow-hidden bg-white aspect-[800/480] relative rounded">
                    <canvas id="inkyCanvas" width="800" height="480" class="w-full h-full object-contain"></canvas>
                </div>
                <div class="mt-4 flex gap-2">
                    <button id="pushNowBtn" class="bg-black hover:bg-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 text-white px-4 py-2 rounded w-full transition font-semibold flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Push to Inky Now
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border dark:border-gray-700 h-[calc(100vh-8rem)] flex flex-col">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                <i data-lucide="blocks" class="w-5 h-5 text-gray-500"></i>
                Plugin Library
            </h2>
            
            <div class="mb-4 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search plugins..." class="w-full pl-10 border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 p-2 rounded focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-gray-500 transition">
            </div>

            <div id="pluginList" class="flex-1 overflow-y-auto pr-2 space-y-2 pb-4 scrollbar-thin">
                </div>
        </div>

    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-gray-800 m-5 p-6 rounded-xl shadow-2xl w-full max-w-md border dark:border-gray-700 text-gray-900 dark:text-gray-100">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                Inky Configuration
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Inky Local URL</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="link" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input type="text" id="inkyUrlInput" class="w-full pl-10 border dark:border-gray-600 bg-white dark:bg-gray-700 p-2 rounded focus:ring-black dark:focus:ring-gray-500" placeholder="http://inky.local">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Update Interval (Seconds)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="timer" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <input type="number" id="intervalInput" class="w-full pl-10 border dark:border-gray-600 bg-white dark:bg-gray-700 p-2 rounded focus:ring-black dark:focus:ring-gray-500" value="15" min="1">
                    </div>
                </div>
                
                <div class="border-t dark:border-gray-700 pt-4 mt-4 bg-gray-50 dark:bg-gray-900 -mx-6 px-6 pb-6 rounded-b-xl">
                    <div class="flex justify-between items-end mb-4 pt-2">
                        <h3 class="text-md font-bold flex items-center gap-2">
                            <i data-lucide="key" class="w-4 h-4 text-gray-500"></i> Plugin Settings
                        </h3>
                        <span id="activePluginNameLabel" class="text-xs font-mono bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-2 py-1 rounded">Global</span>
                    </div>
                    <div id="apiKeysContainer" class="space-y-2">
                        </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2 px-6 pb-2 -mx-6">
                <button id="closeSettingsBtn" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition flex items-center gap-1">
                    <i data-lucide="x" class="w-4 h-4"></i> Cancel
                </button>
                <button id="saveSettingsBtn" class="px-4 py-2 bg-black dark:bg-white text-white dark:text-black font-semibold rounded hover:bg-gray-800 dark:hover:bg-gray-200 transition flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Save & Apply
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
